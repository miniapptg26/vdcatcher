<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ВЕЙП ДЕД · ЖИЖА</title>
<meta name="description" content="8-бит ретро-мини-игра: Вейп-дед ловит баночки жидкости. Telegram Mini App на GitHub Pages.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="wrap">
  <header class="hud">
    <div class="hud-block"><span class="hud-label">СЧЁТ</span><span id="score" class="hud-value">0</span></div>
    <div class="hud-block center"><span class="hud-label">УРОВЕНЬ</span><span id="level" class="hud-value">1</span></div>
    <div class="hud-block right"><span class="hud-label">ЖИЗНИ</span><span id="lives" class="hud-value">❤️❤️❤️🖤🖤</span></div>
  </header>
  <div id="stage">
    <canvas id="game" width="480" height="640">Ваш браузер не поддерживает canvas</canvas>
    <div class="scanlines"></div>
    <div id="combo" class="combo hidden"></div>
    <div id="banner" class="banner"></div>
    <div id="screen-start" class="screen">
      <div class="big-emoji">🍶</div>
      <div class="title">ВЕЙП ДЕД<br>· ЖИЖА ·</div>
      <div class="subtitle">ЛОВИ БАНОЧКИ ЖИЖИ<br>УВОРАЧИВАЙСЯ ОТ ОКУРКОВ 🚬<br>ПАЛИ ТОЧНО — ЛОВИ PERFECT!</div>
      <button class="btn" id="btn-start">▶ СТАРТ</button>
      <div class="hint">ВЕДИ ПАЛЬЦЕМ ИЛИ СТРЕЛКИ ← →<br>РЕКОРД: <span id="start-best">0</span><br>ТИТУЛ: <span id="start-rank">НОВИЧОК</span></div>
    </div>
    <div id="screen-over" class="screen hidden">
      <div class="title">ИГРА<br>ОКОНЧЕНА</div>
      <div class="score-big" id="final-score">0</div>
      <div class="record-line">РЕКОРД: <span id="best-score">0</span></div>
      <div class="record-line">ТИТУЛ: <span id="over-rank">НОВИЧОК</span></div>
      <div id="new-best" class="hidden">★ НОВЫЙ РЕКОРД! ★</div>
      <button class="btn" id="btn-restart">⟳ ЕЩЁ РАЗ</button>
    </div>
  </div>
  <footer class="footer" id="greeting">ЛОВИ ЖИЖУ, ДЕД!</footer>
</div>
<script src="game.js"></script>
</body>
</html>
