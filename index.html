<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="ВЕЙП ДЕД · Башня — мини-игра в Telegram: строй башню из коробок жидкости для вейпа.">
<title>ВЕЙП ДЕД · Башня</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="hud-left">
      <div class="score-label">СЛОЁВ</div>
      <div class="score-value" id="score">0</div>
    </div>
    <div class="hud-title">ВЕЙП&nbsp;ДЕД</div>
    <div class="hud-right">
      <button class="icon-btn" id="muteBtn" aria-label="Звук">🔊</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="scene" id="scene">
      <div class="camera" id="camera">
        <div class="podium" id="podium"></div>
        <div class="glow" id="glow"></div>
      </div>
    </div>
    <div class="tap-hint hidden" id="tapHint">ТАП — СБРОС КОРОБКИ</div>
    <div class="perfect hidden" id="perfect">ИДЕАЛЬНО!</div>
  </main>

  <section class="overlay" id="startOverlay">
    <div class="panel">
      <div class="logo">ВЕЙП<span>ДЕД</span></div>
      <h1>БАШНЯ</h1>
      <p class="greet" id="greet"></p>
      <p class="rules">Лови коробки жидкости и строй башню выше всех. Тап — сброс коробки. Чем выше, тем быстрее.</p>
      <button class="big-btn" id="startBtn">ИГРАТЬ</button>
    </div>
  </section>

  <section class="overlay hidden" id="overOverlay">
    <div class="panel">
      <div class="logo small">ВЕЙП<span>ДЕД</span></div>
      <h1>БАШНЯ РАССЫПАЛАСЬ</h1>
      <div class="result">
        <div class="result-item"><span class="result-label">СЛОЁВ</span><span class="result-value" id="finalScore">0</span></div>
        <div class="result-item"><span class="result-label">РЕКОРД</span><span class="result-value" id="finalBest">0</span></div>
      </div>
      <button class="big-btn" id="restartBtn">ЕЩЁ РАЗ</button>
      <button class="ghost-btn" id="menuBtn">В МЕНЮ</button>
    </div>
  </section>
</div>
<script src="game.js"></script>
</body>
</html>
